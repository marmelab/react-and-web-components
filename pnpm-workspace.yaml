packages:
  - lab
  - enterprise/*

# @vitejs/plugin-react 6.1.2 declares oxc-transform-react@^0.152.0, which for a
# 0.x version only allows 0.152.x. The lab runs the latest native compiler
# (0.154) on purpose; checked with the regression run, see FINDINGS §6.
peerDependencyRules:
  allowedVersions:
    "@vitejs/plugin-react>oxc-transform-react": "0.154"
